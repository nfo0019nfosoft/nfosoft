<!DOCTYPE html>
<html>
<head>

<title>Portfolio Access</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>

body{
font-family:Poppins;
background:#f5f5f5;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

/* FORM BOX */

.form-box{
background:#fff;
padding:40px;
border-radius:10px;
width:350px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
text-align:center;
}

.form-box h2{
margin-bottom:20px;
}

.form-box input{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:6px;
}

.form-box button{
width:100%;
padding:12px;
background:#584379;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="form-box">

<h2>View Our Portfolio</h2>

<form id="portfolioForm">

<input type="text" name="name" placeholder="Your Name" required>

<input type="email" name="email" placeholder="Email Address" required>

<input type="text" name="phone" placeholder="Phone Number" required>

<button type="submit">View Portfolio</button>

</form>

</div>




<script>
  document.getElementById("portfolioForm").addEventListener("submit", function(e){
    e.preventDefault();

    // 4th parameter గా నీ Public Key ఇక్కడ ఇవ్వు (DKD3j41IBHNXCUvvZ)
    emailjs.sendForm("service_fia8wdn", "template_mmdy9nf", this, "DKD3j41IBHNXCUvvZ")
    .then(function(){
        // పర్మిషన్ గ్రాంట్ చేయడం
        sessionStorage.setItem("portfolio_access_granted", "true");
        window.location.href = "portfolio.html";
    })
    .catch(function(error){
        console.error("Email Error:", error);
        // Error వచ్చినా వెళ్లాలనుకుంటే కింది లైన్ ఉంచు
        sessionStorage.setItem("portfolio_access_granted", "true");
        window.location.href = "portfolio.html";
    });
});

</script>


</body>
</html>
